name: Deploy App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start all containers
        run: docker compose -f services/taskapi/docker-compose.yml up -d

      - name: Verify everything is running
        run: docker compose -f services/taskapi/docker-compose.yml ps

      # 🔍 DEBUG STEP: Print logs so you can see if FastAPI or Uvicorn crashed
      - name: Print Container Logs on Failure
        if: always() # Runs even if previous steps failed
        run: docker compose -f services/taskapi/docker-compose.yml logs api

      - name: Test if API responds
        run: curl http://localhost:8000/health

