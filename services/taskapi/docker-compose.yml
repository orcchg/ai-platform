services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: "postgresql+asyncpg://app:app@postgres:5432/app"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET: "67cb14a018388e5ae4e4bc31fdc565bdc1d7a17d0396574b0e2eb170e2bb7be8"
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
  redis:
    image: redis:7
